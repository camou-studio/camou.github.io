<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411">
  <meta name="description" content="camou — Gleiche Fragen. Neue Perspektiven.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" crossorigin>
  <link rel="preload" href="./assets/hero.jpg" as="image" fetchpriority="high">
  <title>camou — independent artist</title>
  <link rel="preload" href="./fonts/manrope_5.3.0_latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/dm-mono-v16-latin-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
  </script>
  <script type="module" src="script.js"></script>
</head>
<body class="camou-loading">
  <div class="camou-intro" id="camou-intro" role="status" aria-live="polite" aria-label="CAMOU wird geladen">
    <div class="camou-intro__atmosphere" aria-hidden="true">
      <div class="camou-intro__horizon"></div>
    </div>
    <div class="camou-pixel-reveal" id="camou-pixel-reveal" aria-hidden="true"></div>
    <div class="camou-intro__brand logo" id="camou-intro-brand" aria-label="camou">camou<span>.</span></div>
    <div class="camou-intro__loader">
      <div class="camou-intro__status" id="camou-intro-status">EXPERIENCE WIRD VORBEREITET</div>
      <div class="camou-intro__track" aria-hidden="true">
        <span class="camou-intro__progress" id="camou-intro-progress"></span>
      </div>
      <div class="camou-intro__percent" id="camou-intro-percent">08%</div>
    </div>
  </div>
  <main class="experience">
    <header class="topbar">
      <a class="logo" href="#" id="logo">camou<span>.</span></a>
      <nav class="navigation" aria-label="Hauptnavigation">
        <button class="nav-link active" data-section="0">Home</button>
        <button class="nav-link" data-section="1">Music</button>
        <button class="nav-link" data-section="2">Visuals</button>
        <button class="nav-link" data-section="3">Archive</button>
        <button class="nav-link" data-section="4">Contact</button>
      </nav>
      <div class="top-note">INDEPENDENT ARTIST / SWITZERLAND</div>
    </header>

    <section class="globe-stage" aria-label="Drehbare Camou-Kugel">
      <div id="globe"></div>
      <div class="zoom-controls" aria-label="Zoom">
        <button id="zoom-in" aria-label="Vergrößern">+</button>
        <button id="zoom-out" aria-label="Verkleinern">−</button>
        <button id="zoom-reset" aria-label="Zoom zurücksetzen">↺</button>
      </div>
      <div class="interaction-hint" id="hint"><span class="hint-dot"></span> DRAG TO EXPLORE</div>
      <div class="section-indicator">
        <span id="current-section">HOME</span>
        <span class="indicator-line"></span>
        <span id="section-number">01 / 05</span>
      </div>
    </section>

    <footer class="footer">
      <span>camou — independent artist / Switzerland</span>
      <div class="footer-links">
        <a href="#" id="instagram-link">Instagram</a>
        <a href="#" id="spotify-link">Spotify</a>
        <a href="mailto:camou.kontakt@gmail.com">Contact ↗</a>
      </div>
    </footer>
  </main>
</body>
</html>
