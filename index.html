<body>
  <main class="experience">
    <header class="topbar">
      <a class="logo" href="#" id="logo" aria-label="camOu – zur Startansicht">camOu<span>.</span></a>

        <button class="nav-link" type="button" data-section="4">Contact</button>
      </nav>

      <div class="top-note">PROJECT</div>
    </header>

    <section class="globe-stage" aria-label="Drehbare Camou-Kugel">
      <div id="globe"></div>

      <!-- CONTACT MODAL: script.js verschiebt den Dialog direkt unter body. -->
      <div class="contact-modal" id="contact-modal" hidden role="dialog" aria-modal="true" aria-labelledby="contact-modal-title" tabindex="-1">
        <div class="contact-modal-backdrop" data-close-contact></div>
        <div class="contact-modal-panel" role="document">
          <div class="contact-modal-header">
            <span id="contact-modal-title">camOu / CONTACT</span>
            <button type="button" id="contact-modal-close" aria-label="Kontaktfenster schliessen">&times;</button>
          </div>

          <form id="contact-form" class="contact-modal-form">
            <p>Für Anfragen und Zusammenarbeit. Oder einfach so.</p>

            <label>Name
              <input name="name" type="text" autocomplete="name" maxlength="120" required>
            </label>

            <label>E-Mail
              <input name="email" type="email" autocomplete="email" maxlength="120" required>
            </label>

            <label>Betreff
              <input name="subject" type="text" maxlength="120" required>
            </label>

            <label>Nachricht
              <textarea name="message" rows="5" maxlength="1200" required></textarea>
            </label>

            <label class="contact-privacy">
              <input name="privacy" type="checkbox" required>
              <span>Ich stimme der Verarbeitung meiner Angaben zur Bearbeitung der Anfrage zu.
                <a href="impressum.html" target="_blank" rel="noopener noreferrer">Impressum / Datenschutz</a>
              </span>
            </label>

            <button type="submit" id="contact-submit">NACHRICHT SENDEN ↗</button>
            <p id="contact-status" class="contact-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>

      <!-- SPOTIFY MODAL -->
      <div class="spotify-modal" id="spotify-modal" hidden role="dialog" aria-modal="true" aria-label="Spotify-Musikplayer" tabindex="-1">
        <div class="spotify-modal-backdrop" data-close-spotify></div>
        <div class="spotify-modal-panel" role="document">
          <div class="spotify-modal-header">
            <span>camOu / MUSIK</span>
            <button type="button" id="spotify-modal-close" aria-label="Spotify-Fenster schliessen">&times;</button>

        <button type="button" id="zoom-out" aria-label="Verkleinern">−</button>
        <button type="button" id="zoom-reset" aria-label="Zoom zurücksetzen">↺</button>
      </div>

      <div class="interaction-hint" id="hint">
        <span class="hint-dot" aria-hidden="true"></span>
        DRAG TO EXPLORE
      </div>

      <div class="section-indicator" aria-live="polite">
